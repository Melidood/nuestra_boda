<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Invitación de boda de Ana y Julio. 19 de diciembre de 2026, Tarandacuao, Guanajuato.">
  <title>Ana &amp; Julio | Nuestra boda</title>
  
  <!-- Tipografías de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  
  <!-- Enlace a tu archivo de estilos -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Reproductor de audio de fondo -->
  <audio id="bg-music" loop preload="auto">
    <source src="musica-boda.mp3" type="audio/mpeg">
  </audio>
  <button id="music-toggle" class="music-btn" aria-label="Reproducir/Pausar música">
    <span id="music-icon">🎵</span>
  </button>

  <main class="invitation">
    <!-- Flores vectoriales de las esquinas -->
    <div class="floral floral-left" aria-hidden="true"><img src="flores-izquierda.svg" alt=""></div>
    <div class="floral floral-right" aria-hidden="true"><img src="flores-derecha.svg" alt=""></div>

    <!-- Sobre Vectorial con Animación interactiva -->
    <section class="hero-envelope" id="hero-envelope" aria-label="Sobre de Invitación">
      <div class="envelope-image-container">
        
        <!-- Imagen del sobre vectorial (sobre.svg) -->
        <img src="sobre.svg" alt="Sobre de invitación" class="real-envelope-bg">

        <!-- Emblema circular exacto con el logo ayj.svg sobre el sobre -->
        <div class="monogram-container" aria-label="Logo A y J">
          <img src="ayj.svg" id="monogram-img" alt="Logo Ana & Julio" class="monogram-svg">
        </div>

      </div>
    </section>

    <!-- Detalles de la invitación -->
    <section class="details">
      <h1 class="couple-names"><span id="bride-name">Ana</span> <span class="ampersand">&amp;</span> <span id="groom-name">Julio</span></h1>
      <div class="subtitle"><span></span><p>NUESTRA BODA</p><span></span></div>
      <p class="date-pill" id="date-label">19 | DICIEMBRE | 26</p>
      <p class="venue"><span id="venue-city">TARANDACUAO, GTO.</span></p>

      <p class="save-date">SAVE THE DATE</p>
    </section>

    <!-- Cuenta regresiva con Días, Horas, Minutos y Segundos -->
    <section class="countdown-area" aria-label="Cuenta regresiva para la boda">
      <p class="countdown-intro" id="countdown-intro">FALTAN:</p>
      <div class="countdown" id="countdown">
        <div class="count-unit"><span class="count-number" id="days">--</span><span class="count-label">DIAS</span></div>
        <div class="count-unit"><span class="count-number" id="hours">--</span><span class="count-label">HORAS</span></div>
        <div class="count-unit"><span class="count-number" id="minutes">--</span><span class="count-label">MINUTOS</span></div>
        <div class="count-unit"><span class="count-number" id="seconds">--</span><span class="count-label">SEGUNDOS</span></div>
      </div>
      <p class="wedding-day" id="wedding-day" hidden>¡HOY ES EL GRAN DÍA!</p>
    </section>
  </main>

  <!-- Script incrustado para Autoplay y Animación del Sobre -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const WEDDING_CONFIG = {
        bride: "Ana",
        groom: "Julio",
        date: "2026-12-19T00:00:00",
        city: "TARANDACUAO, GTO.",
        weddingDayMessage: "¡HOY ES EL GRAN DÍA!"
      };

      const targetDate = new Date(WEDDING_CONFIG.date).getTime();

      function updateCountdown() {
        const now = new Date().getTime();
        const remaining = targetDate - now;

        if (remaining <= 0) {
          if (document.getElementById("countdown")) document.getElementById("countdown").hidden = true;
          if (document.getElementById("countdown-intro")) document.getElementById("countdown-intro").hidden = true;
          if (document.getElementById("wedding-day")) document.getElementById("wedding-day").hidden = false;
          return;
        }

        const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
        const hours = Math.floor((remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

        if (document.getElementById("days")) document.getElementById("days").textContent = days;
        if (document.getElementById("hours")) document.getElementById("hours").textContent = String(hours).padStart(2, "0");
        if (document.getElementById("minutes")) document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
        if (document.getElementById("seconds")) document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);

      // Reproducción automática de Música con desbloqueo al interactuar
      const music = document.getElementById("bg-music");
      const musicBtn = document.getElementById("music-toggle");
      const musicIcon = document.getElementById("music-icon");
      let musicStarted = false;

      function playMusic() {
        if (!musicStarted && music) {
          music.play().then(() => {
            musicStarted = true;
            if (musicIcon) musicIcon.textContent = "🔊";
          }).catch(err => {
            console.log("Autoplay bloqueado por el navegador hasta el primer clic.");
          });
        }
      }

      // Intentar reproducir al cargar la página
      playMusic();

      // Desbloquear música al primer clic/toque en la pantalla
      document.body.addEventListener("click", function () {
        playMusic();
      }, { once: true });

      if (musicBtn && music) {
        musicBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          if (music.paused) {
            music.play();
            musicStarted = true;
            if (musicIcon) musicIcon.textContent = "🔊";
          } else {
            music.pause();
            if (musicIcon) musicIcon.textContent = "🎵";
          }
        });
      }

      // Animación de interactividad en el sobre
      const envelope = document.getElementById("hero-envelope");
      if (envelope) {
        envelope.addEventListener("click", function () {
          envelope.classList.add("envelope-open");
          playMusic();
          setTimeout(() => {
            envelope.classList.remove("envelope-open");
          }, 600);
        });
      }
    });
  </script>
</body>
</html>
